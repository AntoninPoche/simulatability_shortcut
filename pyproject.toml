[project]
name = "simulatability-shortcut"
version = "0.0.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "datasets",
    "interpreto",
    "transformers",
    "tokenizers==0.22.2",
    "tqdm",
    "ipykernel",
    "pandas",
    "torch",
    "vllm",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
vllm = { index = "vllm-nightly-cu130" }

[[tool.uv.index]]
name = "vllm-nightly-cu130"
url = "https://wheels.vllm.ai/nightly/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# UV_HTTP_TIMEOUT=300 UV_TORCH_BACKEND=cu130 uv sync --reinstall --prerelease=allow